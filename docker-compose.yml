services:
  db:
    image: postgis/postgis:16-3.4
    container_name: bowen_navigator_postgis
    environment:
      POSTGRES_DB: bowen_navigator
      POSTGRES_USER: bowen
      POSTGRES_PASSWORD: bowen_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bowen -d bowen_navigator"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: bowen_navigator_pgadmin
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bowen-navigator.local
      PGADMIN_DEFAULT_PASSWORD: bowen_admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bowen_navigator_backend
    restart: always
    ports:
      - "8001:8000"
    env_file:
      - ./backend/.env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=bowen_navigator
      - POSTGRES_USER=bowen
      - POSTGRES_PASSWORD=bowen_dev_password
    volumes:
      - ./backend:/app
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgis_data:
  pgadmin_data:

