name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: bowen_navigator
          POSTGRES_USER: bowen
          POSTGRES_PASSWORD: bowen_dev_password
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U bowen -d bowen_navigator"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install system geospatial libraries & fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev binutils libproj-dev fonts-dejavu-core

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run Django system check, seed check & test suite
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: "False"
          ALLOWED_HOSTS: 127.0.0.1,localhost
          POSTGRES_DB: bowen_navigator
          POSTGRES_USER: bowen
          POSTGRES_PASSWORD: bowen_dev_password
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          REDIS_URL: redis://127.0.0.1:6379/1
        run: |
          python manage.py check
          python manage.py migrate --noinput
          python manage.py seed_campus
          python manage.py test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run mobile unit tests
        run: npm test
